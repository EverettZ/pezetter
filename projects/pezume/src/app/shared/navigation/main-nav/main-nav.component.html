
<mat-toolbar>
    <span>
        <a [routerLink]="['/']">pezume</a>
        // Everett Zettersten
    </span>
    <span class="flex-fill"></span>

    <!-- If logged in, show avatar button -->
    <button *ngIf="authService.currUser" mat-icon-button aria-label="User settings">
        <mat-icon>
            face
        </mat-icon>
    </button>

    <!-- Else, show login button -->
    <a *ngIf="!authService.currUser" [routerLink]="['/login']" mat-icon-button aria-label="Login">
        <mat-icon>
            account_circle
        </mat-icon>
    </a>
</mat-toolbar>
