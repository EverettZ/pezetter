<pez-full-layout>
    <br>
    <form (ngSubmit)="onSubmit()" [formGroup]="searchForm">
        <div class="row">
            <div class="col-12">
                <mat-form-field class="btn-block mb-4">
                    <!-- <mat-chip-list #chipList aria-label="Resume search">
                        <mat-chip *ngFor="let term of searchTerms" [selectable]="selectable" [removable]="removable"
                            (removed)="remove(term)">
                            {{term.name}}
                            <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
                        </mat-chip>
                        <input formControlName="search" placeholder="Search resumes" [matChipInputFor]="chipList"
                            [matChipInputSeparatorKeyCodes]="separatorKeysCodes" [matChipInputAddOnBlur]="addOnBlur"
                            (matChipInputTokenEnd)="add($event)">
                        <mat-icon matSuffix>search</mat-icon>
                    </mat-chip-list> -->
                    <input type="text" matInput formControlName="search">
                    <mat-icon matSuffix>search</mat-icon>
                    <mat-hint>Press enter add a search term</mat-hint>
                </mat-form-field>
            </div>
        </div>
    </form>
    <br>
    <div class="row">
        <div class="col-12">
            <div class="card-columns">
                <pez-add-resume></pez-add-resume>
                <pez-resume-card *ngFor="let res of resumeService.resumePreviews$ | async" [resume]="res"></pez-resume-card>
            </div>
        </div>
    </div>
    <ng-container *ngIf="(pageSizeOptions$ | async) as pageSizeOptions">
        <mat-paginator (page)="resumeService.paginate($event.pageIndex, $event.pageSize);"
            [pageIndex]="resumeService.query.start" [length]="resumeService.query.size"
            [pageSize]="resumeService.query.limit" [pageSizeOptions]="pageSizeOptions">
        </mat-paginator>
    </ng-container>
</pez-full-layout>
