<pez-full-layout>
    <br>
    <form [formGroup]="searchForm">
        <div class="row">
            <div class="col-12">

                <mat-form-field class="mr-1">
                    <mat-label>Search by</mat-label>
                    <mat-select [formControl]="filterBy">
                        <mat-option *ngFor="let opt of filterByOptions" [value]="opt.value">
                            {{opt.viewValue}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field class="mb-4">
                    <input type="text" matInput [formControl]="search">
                    <mat-icon matSuffix>search</mat-icon>
                    <mat-hint>Press enter add a search term</mat-hint>
                </mat-form-field>
                <mat-checkbox class="d-block" [formControl]="sortDescending">Sort descending</mat-checkbox>
            </div>
        </div>
    </form>
    <br>
    <div class="row">
        <div class="col-12">
            <div class="card-columns">
                <pez-add-resume></pez-add-resume>
                <pez-resume-card *ngFor="let res of resumeService.resumePreviews$ | async" [resume]="res">
                </pez-resume-card>
            </div>
        </div>
    </div>
    <ng-container *ngIf="resumeService.query.size > 0">
        <mat-paginator [disabled]="resumeService.loading$ | async " (page)="paginateChange($event);"
            [pageIndex]="resumeService.query.start" [length]="resumeService.query.size"
            [pageSize]="resumeService.query.limit" [pageSizeOptions]="smallPageSizeOption">
        </mat-paginator>
    </ng-container>
</pez-full-layout>
