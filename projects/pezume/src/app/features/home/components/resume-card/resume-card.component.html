<mat-card>
    <mat-card-header>
        <img mat-card-avatar [src]="resume.photoURL" alt="">
        <mat-card-title>{{resume.title}}</mat-card-title>
        <mat-card-subtitle>{{resume.subtitle}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <p>
            {{resume.about | maxLengthEtc:200}}
        </p>
    </mat-card-content>
    <mat-card-actions class="d-flex justify-content-end">
        <div class="col-auto">
            <a [routerLink]="['/resume', resume.id]" mat-flat-button color="primary">View</a>
        </div>
    </mat-card-actions>
</mat-card>
