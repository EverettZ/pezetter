steps:
  # Install node packages
  - name: 'gcr.io/cloud-builders/npm:node-10.16.0'
    args: [ 'install' ]

  # Build productive files
  - name: 'gcr.io/cloud-builders/npm:node-10.16.0'
    args: [ 'run', 'build', '--prod' ]

  # Deploy
  - name: 'gcr.io/$_PROJECT_ID/firebase'
    args: ['deploy']
