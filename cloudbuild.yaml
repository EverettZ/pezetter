steps:

  # firebase version
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args: ['--version']

  # Install node packages
  - name: 'gcr.io/cloud-builders/npm:current'
    args: [ 'install' ]

  # Build productive files
  - name: 'gcr.io/cloud-builders/npm:current'
    args: [ 'run', 'build', '--prod' ]

  # Deploy
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args: ['deploy']
