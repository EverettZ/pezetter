steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['kms', 'decrypt', '--ciphertext-file=.env.enc', '--plaintext-file=.env', '--location=global', '--keyring=pezetterKeyRing', '--key=cloudbuild-env']

  # Install node packages
  - name: 'gcr.io/cloud-builders/npm:current'
    args: [ 'install' ]

  # Build productive files
  - name: 'gcr.io/cloud-builders/npm:current'
    args: [ 'run', 'build', '--prod' ]

  # Deploy
  - name: 'gcr.io/cloud-builders/npm:current'
    args: ['run', 'deploy']
