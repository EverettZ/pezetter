steps:
  - name: 'gcr.io/cloud-builders/npm:node-10.10.0'
    entrypoint: 'node'
    args: ['--version']

  # Install firebase
  - name: 'gcr.io/cloud-builders/npm:node-10.10.0'
    args: [ 'install', '-g', 'firebase-tools' ]

  # Install node packages
  - name: 'gcr.io/cloud-builders/npm:node-10.10.0'
    args: [ 'install' ]

  # Build productive files
  - name: 'gcr.io/cloud-builders/npm:node-10.10.0'
    args: [ 'run', 'build', '--prod' ]

  # Deploy
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args: ['deploy']
