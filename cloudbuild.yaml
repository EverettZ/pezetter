steps:
  - name: 'gcr.io/cloud-builders/npm:node-10.15.3'
    entrypoint: 'node'
    args: ['--version']

  # Install node packages
  - name: 'gcr.io/cloud-builders/npm:node-10.15.3'
    args: [ 'install' ]

  # Build productive files
  - name: 'gcr.io/cloud-builders/npm:node-10.15.3'
    args: [ 'run', 'build', '--prod' ]

  # Deploy
  - name: 'gcr.io/$_PROJECT_ID/firebase'
    args: ['deploy']
