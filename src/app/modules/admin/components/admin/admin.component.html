<h1>Admin</h1>
<div *ngIf="auth.user$ | async as user; else login;">
  <div class="row">
    <div class="col-12">
      <pre>{{user | json}}</pre>
      <h4>
        {{user.displayName}}
      </h4>
      <button mat-raised-button (click)="auth.signOut()">Sign out</button>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <button mat-raised-button (click)="auth.updateResume(user.uid)">update</button>
    </div>
  </div>
</div>

<ng-template #login>
  <mat-card>

    <form [formGroup]="loginForm" (ngSubmit)="auth.googleSignIn(loginForm.value)">
      <div class="row">
        <div class="col-12">

          <mat-form-field>
            <input matInput placeholder="email" formControlName="email" type="email" name="loginEmail" id="loginEmail">
          </mat-form-field>

        </div>
      </div>

      <div class="row">
        <div class="col-12">

          <mat-form-field>
            <input matInput placeholder="password" formControlName="pw" type="password" name="loginPW" id="loginPW">
          </mat-form-field>

        </div>
      </div>

      <button mat-raised-button type="submit">Login</button>

    </form>

  </mat-card>
</ng-template>
