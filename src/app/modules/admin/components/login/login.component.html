<div class="row justify-content-center align-items-center">
  <div class="col-xs-12 col-sm-8 col-md-4 ">
    <form [formGroup]="loginForm" (ngSubmit)="signIn()">
      <mat-card>

        <mat-card-title>
          Login
        </mat-card-title>

        <mat-card-content>

          <div class="row">
            <div class="col-12">

              <mat-form-field>
                <input matInput required placeholder="email" formControlName="email" type="email" name="loginEmail" id="loginEmail">
                <mat-error *ngIf="loginForm.get('email').invalid">{{getErrorMessage()}}</mat-error>
              </mat-form-field>

            </div>
          </div>

          <div class="row">
            <div class="col-12">

              <mat-form-field>
                <input matInput required placeholder="password" formControlName="pw" type="password" name="loginPW" id="loginPW">
              </mat-form-field>

            </div>
          </div>

        </mat-card-content>

        <mat-card-actions>

          <button [disabled]="loginForm.invalid" mat-raised-button type="submit">Login</button>

        </mat-card-actions>

      </mat-card>
    </form>
  </div>
</div>
