<div class="row justify-content-center">
  <div class="col-8 col-sm-6 col-md-4 col-lg-3 col-xl-2 mb-auto text-center">
    <button class="rounded-circle p3 mb-3 border" mat-button (click)="openMenu()" [matBadgeHidden]="!showBadge" color="primary" matBadge="!" matBadgePosition="above after" [matTooltip]="tooltipText" (mouseover)="hideBadge()">
      <img class="rounded-circle" [src]="avatar" alt="avatar img">
      <mat-icon>more_horiz</mat-icon>
    </button>
  </div>
</div>
