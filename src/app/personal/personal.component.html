<div class="row justify-content-center align-items-center">
  <div class="col-sm-12 col-md-9 col-ctr mt-md-5">
    <mat-card >
      <mat-card-header>
        <div class="row justify-content-start align-items-center">
          <pez-avatar class="avatar-img" [avatar]="personal.avatar"></pez-avatar>
        </div>
      </mat-card-header>
      <mat-card-content>
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-12 col-md-5 left-card">
              <br>
              <div class="row">
                <div class="col-9">
                  <h4>About me</h4>
                </div>
                <div class="col-12 col-md-10">
                  <ul>
                    <li>
                      <h6>{{personal.description}}</h6>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="row">
              </div>
            </div>
            <div class="col-sm-12 col-md-7 right-card">
              <br>
              <div class="row justify-content-md-end justify-content-xs-center">
                <div class="col-md-11 col-xs-12 text-center">
                  <pez-text-decode [value]="personal.name"></pez-text-decode>
                </div>
              </div>
              <br>
              <div class="row">
                <div class="col-12">
                  <h4 class=" text-center">
                    <mat-icon>contact_mail</mat-icon>
                    {{personal.email}}
                  </h4>
                </div>
              </div>
              <div class="row">
                <div class="col-12">
                  <h4 class=" text-center">
                    <mat-icon>contact_phone</mat-icon>
                    {{personal.phone}}
                  </h4>
                </div>
              </div>
              <br>
              <div class="row">
                <div class="col-6" *ngFor="let link of links">
                  <div class="link-button">
                    <a uppercase mat-stroked-button routerLinkActive="active-link" [routerLink]="link" color="primary">{{link}}</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <br>
      </mat-card-content>
    </mat-card>
  </div>
</div>
